services:
  traefik:
    image: traefik:v3.1.6
    container_name: traefik
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "${DASHBOARD_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "${CONFIG_PATH}:/etc/traefik"
    restart: unless-stopped