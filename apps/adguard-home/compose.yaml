services:
  adguard-home:
    image: adguard/adguardhome:v0.107.54
    container_name: adguard-home
    ports:
      - "${DNS_PORT}:53/tcp"
      - "${DNS_PORT}:53/udp"
      - "${WEB_PORT}:3000"
    volumes:
      - "${DATA_PATH}/work:/opt/adguardhome/work"
      - "${DATA_PATH}/conf:/opt/adguardhome/conf"
    restart: unless-stopped