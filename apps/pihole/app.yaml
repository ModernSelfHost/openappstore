schemaVersion: 1
id: pihole
name: Pi-hole
version: "2024.07.0"
description: Network-wide ad blocking via your own DNS server.
category: network
homepage: https://pi-hole.net
icon: icon.svg
runtime: compose
compose:
  file: compose.yaml
inputs:
  - key: DATA_PATH
    label: Data folder
    type: path
    default: /mnt/pihole
  - key: WEB_PORT
    label: Web port
    type: port
    default: 8080
  - key: DNS_PORT
    label: DNS port
    type: port
    default: 53
  - key: TZ
    label: Timezone
    type: string
    default: UTC
  - key: WEBPASSWORD
    label: Web password
    type: password
    generate: true
requirements:
  cpu: 1
  ram: 256
  disk: 1G
  arch:
    - amd64
    - arm64