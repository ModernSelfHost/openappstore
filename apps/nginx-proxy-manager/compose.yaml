services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.12.3
    container_name: nginx-proxy-manager
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "${ADMIN_PORT}:81"
    volumes:
      - "${DATA_PATH}/data:/data"
      - "${DATA_PATH}/letsencrypt:/etc/letsencrypt"
    restart: unless-stopped