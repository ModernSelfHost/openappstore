schemaVersion: 1
id: nginx-proxy-manager
name: Nginx Proxy Manager
version: "2.12.3"
description: Manage Nginx proxy hosts with a simple web interface.
category: network
homepage: https://nginxproxymanager.com
icon: icon.svg
runtime: compose
compose:
  file: compose.yaml
inputs:
  - key: DATA_PATH
    label: Data folder
    type: path
    default: /mnt/npm
  - key: HTTP_PORT
    label: HTTP port
    type: port
    default: 80
  - key: HTTPS_PORT
    label: HTTPS port
    type: port
    default: 443
  - key: ADMIN_PORT
    label: Admin port
    type: port
    default: 81
requirements:
  cpu: 1
  ram: 256
  disk: 1G
  arch:
    - amd64